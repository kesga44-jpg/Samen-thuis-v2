<!doctype html><html lang="nl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17243a"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Samen Thuis">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css?v=250"><title>Samen Thuis</title></head><body>
<div class="app-shell"><aside class="sidebar" aria-label="Hoofdnavigatie">
<div class="brand"><span class="brand-mark">S</span><div><strong>Samen Thuis</strong><small>Kees & Daphne</small></div></div>
<nav id="nav"></nav><div class="sidebar-footer">
<button class="nav-item" data-action="backup"><span>↥</span> Back-up maken</button>
<button class="nav-item" data-action="restore"><span>↧</span> Back-up laden</button>
<input id="restoreInput" type="file" accept="application/json" hidden>
<input id="groceryImportFile" type="file" accept=".txt,.csv,.json,text/plain,text/csv,application/json" hidden>
<input id="ostaImportFile" type="file" accept=".txt,.csv,.json,text/plain,text/csv,application/json" hidden>
<input id="calendarImportFile" type="file" accept=".txt,.csv,.json,text/plain,text/csv,application/json" hidden>
<input id="travelImportFile" type="file" accept=".pdf,.txt,text/plain,application/pdf" hidden></div></aside>
<main><header class="topbar"><div><p id="eyebrow">Goedemorgen</p><h1 id="pageTitle">Vandaag</h1></div>
<div class="top-actions"><span id="syncState" class="sync-state">Alleen dit apparaat</span><span id="saveState" class="save-state">Lokaal bewaard</span>
<button id="laptopSaveBtn" class="secondary laptop-save"><span class="full-label">⇩ Opslaan voor laptop</span><span class="short-label">⇩ Laptop</span></button>
<button id="addBtn" class="primary">＋ Toevoegen</button></div></header><div id="view" class="view" aria-live="polite"></div></main></div>
<nav id="mobileNav" class="mobile-nav" aria-label="Mobiele navigatie"></nav>
<dialog id="itemDialog"><form id="itemForm"><div class="dialog-head"><div><p class="eyebrow">Nieuw</p><h2 id="dialogTitle">Toevoegen</h2></div><button type="button" class="icon-btn" data-close>×</button></div><div id="formFields" class="form-grid"></div><div class="dialog-actions"><button type="button" class="secondary" data-close>Annuleren</button><button type="submit" class="primary">Bewaren</button></div></form></dialog>
<div id="toast" class="toast" role="status"></div><script src="app.js?v=250"></script></body></html>
